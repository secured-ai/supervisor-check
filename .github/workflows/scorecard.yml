name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "41 6 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  scorecard:
    uses: secured-ai/workflows/.github/workflows/scorecard.yml@cdcd70a91411a53f227c354e00de008cbd53c180
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
