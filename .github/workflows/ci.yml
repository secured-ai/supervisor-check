name: CI

# The jobs live in secured-ai/workflows and are pinned by commit SHA rather than
# by @main. A shared workflow is a supply chain concentration point: anyone who
# can push there would otherwise change CI here with no review in this
# repository. Dependabot raises the PR when it moves.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    uses: secured-ai/workflows/.github/workflows/node-suite.yml@cdcd70a91411a53f227c354e00de008cbd53c180
    with:
      node-versions: '["22.18","24"]'

  # The service is only a control while it fails closed. Each guarantee is
  # named, so deleting a test rather than fixing the behaviour turns this red
  # with the specific one that went missing.
  fails-closed:
    uses: secured-ai/workflows/.github/workflows/claims.yml@cdcd70a91411a53f227c354e00de008cbd53c180
    with:
      claims: |
        the agent does not get its own claim evaluated
        facts that cannot be established deny, they do not fall back to the agent
        a resolver that hangs denies rather than waiting forever
        two resolvers that disagree deny, because neither can be trusted
        the agent cannot widen the envelope through context
        a tool outside the envelope is denied before any system of record is touched
        the store has no write path at all
        a supervisor that throws still denies
        the service denies an unknown envelope rather than erroring
        a tampered record does not verify
        a supervisor with no callers will not start
        an unsigned request is refused before anything is evaluated
        a replayed request is refused
        a forged request cannot burn a real caller's nonce
        a caller cannot ask about another caller's envelope, or tell that it exists
        the client acts on the signed record, never on the plain outcome beside it
        a captured allow cannot be replayed as the answer to another question
        the client fails closed when the supervisor cannot be reached
        the client fails closed when the answer starts and then stalls
        an unsigned answer is never an allow
        a pinned certificate that does not chain to the configured CA is refused
        with a client CA configured, a connection without a certificate is refused
        a valid certificate does not rescue a bad signature

  # The suite runs against the source tree. An installed copy differs in two
  # ways no test sees: Node refuses to strip types under node_modules, so a
  # package pointing at its sources cannot be imported at all, and
  # intent-envelope resolves from the consumer's tree rather than this one.
  # Either ships a package that fails on install with CI fully green.
  packaged-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run smoke

  all-checks-passed:
    if: always()
    needs: [suite, fails-closed, packaged-install]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job must have succeeded
        run: |
          echo "suite:            ${{ needs.suite.result }}"
          echo "fails-closed:     ${{ needs['fails-closed'].result }}"
          echo "packaged-install: ${{ needs['packaged-install'].result }}"
          if [ "${{ needs.suite.result }}" != "success" ] || \
             [ "${{ needs['fails-closed'].result }}" != "success" ] || \
             [ "${{ needs['packaged-install'].result }}" != "success" ]; then
            echo "A required job did not succeed."
            exit 1
          fi
          echo "All required checks passed."
