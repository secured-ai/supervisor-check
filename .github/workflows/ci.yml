name: CI

# Actions are pinned to commit SHAs. A tag can be moved to point at different code;
# a SHA cannot. Dependabot keeps these current and raises a PR when one moves.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.18", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install
        run: npm ci
      - name: Types, including the tests
        run: npm run typecheck
      - name: Suite
        run: npm test

  # The service is only a control while it fails closed. These are the claims that
  # make it one, checked by name so that deleting a test rather than fixing the
  # behaviour turns this red with the specific guarantee that went missing.
  fails-closed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.18"
      - name: Install
        run: npm ci
      - name: It denies rather than trusting the agent
        run: |
          npm test 2>&1 | tee /tmp/suite.txt
          for claim in \
            "the agent does not get its own claim evaluated" \
            "facts that cannot be established deny, they do not fall back to the agent" \
            "a resolver that hangs denies rather than waiting forever" \
            "two resolvers that disagree deny, because neither can be trusted" \
            "the agent cannot widen the envelope through context" \
            "the store has no write path at all" \
            "a supervisor that throws still denies" \
            "the service denies an unknown envelope rather than erroring" \
            "a tampered record does not verify"; do
            grep -q "ok .* - $claim" /tmp/suite.txt \
              || { echo "MISSING OR FAILING: $claim"; exit 1; }
          done
          echo "every fail-closed guarantee is still tested and still passing"

  all-checks-passed:
    if: always()
    needs: [suite, fails-closed]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job must have succeeded
        run: |
          echo "suite:        ${{ needs.suite.result }}"
          echo "fails-closed: ${{ needs['fails-closed'].result }}"
          if [ "${{ needs.suite.result }}" != "success" ] || \
             [ "${{ needs['fails-closed'].result }}" != "success" ]; then
            echo "A required job did not succeed."
            exit 1
          fi
          echo "All required checks passed."
