version: 2
updates:
  # The CI workflows pin every action to a commit SHA, which is the point:
  # a tag can be moved to point at different code and a SHA cannot. The cost
  # is that nothing updates itself, so this raises the PR when one moves.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels: ["dependencies"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    labels: ["dependencies"]
